<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機体生成</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h1 {
            font-size: 1.5rem;
            margin: 10px 0;
        }
        canvas { 
            background: #111; 
            border: 1px solid #333; 
            margin-top: 10px; 
            max-width: 100%; 
            height: auto; 
        }
        .ui-panel, .input-panel { 
            margin: 15px auto; 
            max-width: 400px; 
            width: 100%; 
            box-sizing: border-box;
            text-align: left; 
            background: #222; 
            padding: 15px; 
            border-radius: 10px; 
        }
        .action-panel {
            margin: 20px auto;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background: #4ecca3;
            color: #000;
            font-weight: bold;
            margin: 5px;
        }
        button:active {
            opacity: 0.8;
        }
        select, input[type="file"] {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>機体生成</h1>
    <canvas id="canvas" width="400" height="400"></canvas>
    
    <div class="ui-panel">
        <p>機体管理倉庫No: <span id="val-slot">0</span></p>
        <p>機体名: <span id="val-name">-</span></p>
        <p>電脳レベル: <span id="val-level">-</span></p>
        <p>サイズ: <span id="val-size">-</span> | 武器: <span id="val-weapon">-</span></p>
        <p>DEF: <span id="val-def">-</span> / ATK: <span id="val-atk">-</span> / SPD: <span id="val-spd">-</span></p>
    </div>

    <div class="input-panel">
        <p style="margin-top:0;">【方法1】音楽ファイル(.melogefile / 音声)を選ぶ</p>
        <input type="file" id="audioFile" accept="audio/*, .melogefile" style="width: 100%; box-sizing: border-box;">

        <p style="margin-top: 15px;">【方法2】獲得済みコレクションから選ぶ</p>
        <select id="collectionSelect" onchange="selectBgmFromCollection(this.value)" style="width: 100%; padding: 8px; box-sizing: border-box;">
            <option value="">-- 取得済みBGMを選択 --</option>
        </select>
    </div>

    <div class="action-panel">
        <button id="deployBtn">上書き・保存</button>
        <button onclick="location.href='my_robot_manage.html?id=' + (new URLSearchParams(window.location.search).get('id') || '0')" style="background: #666; color: #fff;">戻る</button>
    </div>

    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const slotId = params.get('id') || "0";
        document.getElementById('val-slot').innerText = slotId;

        // 取得済みコレクションをセレクトボックスに反映
        loadCollectionToSelect();

        // 既存の登録データがあれば読み込んで初期表示する
        const savedData = localStorage.getItem(`robot_slot_${slotId}`);
        if (savedData) {
            try {
                const existingRobot = JSON.parse(savedData);
                window.currentStats = existingRobot;
                drawRobot(existingRobot);
                updateUI(existingRobot);
            } catch(e) {
                console.error("既存データの読み込みに失敗しました", e);
            }
        }

        // 1. ファイル読み込み処理
        document.getElementById('audioFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            
            if (file.name.endsWith('.melogefile')) {
                reader.onload = (e) => {
                    const melogeData = JSON.parse(e.target.result);
                    const stats = analyzeMeloGeData(melogeData);
                    stats.bgmData = melogeData; // BGMデータとして保持
                    window.currentStats = stats;
                    drawRobot(stats);
                    updateUI(stats);
                };
                reader.readAsText(file);
            } else {
                reader.onload = (e) => {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    audioCtx.decodeAudioData(e.target.result, (buf) => {
                        const stats = runComplexAnalysis(buf, file.name);
                        stats.bgmData = window.DEFAULT_BGM;
                        window.currentStats = stats;
                        drawRobot(stats);
                        updateUI(stats);
                        audioCtx.close();
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 2. 保存ボタン処理
        document.getElementById('deployBtn').addEventListener('click', () => {
            if(!window.currentStats) return alert("解析を完了してください");
            saveMachine();
        });
    });

    // --- 取得済みコレクションをセレクトボックスに反映する関数 ---
    function loadCollectionToSelect() {
        const select = document.getElementById('collectionSelect');
        if (!select) return;

        select.innerHTML = '<option value="">-- 取得済みBGMを選択 --</option>';

        const storedSongs = JSON.parse(localStorage.getItem('stored_songs_data')) || {};
        const unlockedIds = JSON.parse(localStorage.getItem('unlocked_bgm_ids')) || [];

        unlockedIds.forEach(id => {
            const song = storedSongs[id];
            if (song) {
                const option = document.createElement('option');
                option.value = id;
                option.innerText = `${song.title || '無題'} (作者: ${song.author || '不明'})`;
                select.appendChild(option);
            }
        });
    }

    // --- コレクションからBGMが選ばれたときの処理 ---
    function selectBgmFromCollection(songId) {
        if (!songId) return;
        const storedSongs = JSON.parse(localStorage.getItem('stored_songs_data')) || {};
        const selectedSong = storedSongs[songId];

        if (selectedSong) {
            // 曲データをもとに機体ステータスを解析・生成
            const stats = analyzeMeloGeData(selectedSong);
            stats.bgmData = selectedSong; // 機体のBGMとして保持
            window.currentStats = stats;
            
            drawRobot(stats);
            updateUI(stats);
            alert(`コレクション「${selectedSong.title}」から機体を構築しました！`);
        }
    }

    // --- 描画・解析関数 ---
    function drawRobot(stats) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const scale = stats.scale || 1.0;
        const b = (stats.def * 0.0334 * 2) * scale;
        const a = (stats.atk * 0.0334) * scale;
        const l = (stats.spd * 0.0334) * scale;

        const shapes = [
            {"type": "circle", "x": 200, "y": 80, "r": 30},
            {"type": "rect", "x": 185, "y": 75, "w": 30, "h": 10},
            {"type": "line", "x1": 200, "y1": 110, "x2": 200, "y2": 220},
            {"type": "line", "x1": 170, "y1": 220, "x2": 230, "y2": 220},
            {"type": "line", "x1": 170, "y1": 220, "x2": 170, "y2": 330},
            {"type": "line", "x1": 230, "y1": 220, "x2": 230, "y2": 330},
            {"type": "line", "x1": 150, "y1": 130, "x2": 250, "y2": 130},
            {"type": "line", "x1": 150, "y1": 130, "x2": 120, "y2": 220},
            {"type": "line", "x1": 250, "y1": 130, "x2": 280, "y2": 220}
        ];

        shapes.forEach((s, i) => {
            ctx.beginPath();
            ctx.strokeStyle = stats.color || "#4ecca3";
            ctx.fillStyle = stats.color || "#4ecca3";
            if (i === 2) ctx.lineWidth = Math.max(1, b);
            else if (i >= 6) ctx.lineWidth = Math.max(1, a);
            else if (i >= 3 && i <= 5) ctx.lineWidth = Math.max(1, l);
            else ctx.lineWidth = 2;

            if (s.type === 'circle') { ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
            else if (s.type === 'rect') { ctx.fillStyle = "#000"; ctx.fillRect(s.x, s.y, s.w, s.h); }
            else if (s.type === 'line') { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
        });
    }

    function updateUI(stats) {
        document.getElementById('val-name').innerText = stats.name || "-";
        document.getElementById('val-level').innerText = stats.level !== undefined ? stats.level : 1;
        document.getElementById('val-size').innerText = stats.size || "-";
        document.getElementById('val-weapon').innerText = stats.weapon || "-";
        document.getElementById('val-def').innerText = stats.def || 0;
        document.getElementById('val-atk').innerText = stats.atk || 0;
        document.getElementById('val-spd').innerText = stats.spd || 0;
    }

    function analyzeMeloGeData(data) {
        const seq = Array.isArray(data.sequence) ? data.sequence : [];
        const notes = seq.filter(val => typeof val === 'number' && val > 0);
        const count = notes.length || 1;
        const avg = notes.reduce((a, b) => a + b, 0) / count;
        const baseAtk = (avg % 100); 
        const baseDef = (100 - (avg % 100));
        const baseSpd = (avg % 50) + 25;
        const total = baseAtk + baseDef + baseSpd;
        const ratio = 900 / total;
        
        return {
            name: data.title || "名無しの機体",
            size: (total > 500) ? "L" : "M",
            scale: 1.0,
            level: 1,
            def: Math.max(1, Math.round(baseDef * ratio)),
            atk: Math.max(1, Math.round(baseAtk * ratio)),
            spd: Math.max(1, Math.round(baseSpd * ratio)),
            weapon: (baseAtk > baseDef) ? "ビームガン" : "マシンガン",
            color: "#4ecca3",
            bgmData: data
        };
    }

    function runComplexAnalysis(buffer, fileName) {
        const data = buffer.getChannelData(0);
        const sampleRate = buffer.sampleRate;
        const block = sampleRate;
        const totalSeconds = Math.floor(data.length / block);
        let low = 0, mid = 0, high = 0, totalDensityCount = 0, maxAmp = 0;
        for(let i = 0; i < data.length; i += 2000) maxAmp = Math.max(maxAmp, Math.abs(data[i]));
        for (let sec = 0; sec < totalSeconds; sec++) {
            let l_sec = 0, m_sec = 0, h_sec = 0, densityInThisSec = 0;
            for (let i = 0; i < block; i += 2000) { 
                let index = sec * block + i;
                if(index >= data.length) break;
                let v = Math.abs(data[index]) / (maxAmp || 1);
                if (v > 0.25) densityInThisSec++;
                if (i < block / 3) l_sec += v;
                else if (i < block * 2 / 3) m_sec += v;
                else h_sec += v;
            }
            totalDensityCount += (densityInThisSec / (block / 2000));
            low += l_sec; mid += m_sec; high += h_sec;
        }
        const total = low + mid + high;
        const density = totalDensityCount / (totalSeconds || 1);
        const size = (density < 0.1) ? "SS" : (density < 0.2) ? "S" : (density < 0.35) ? "M" : (density < 0.5) ? "L" : "LL";
        const scaleMap = { "SS": 0.5, "S": 0.7, "M": 1.0, "L": 1.3, "LL": 1.6 };
        const lRatio = Math.pow(low / total, 2), mRatio = Math.pow(mid / total, 2), hRatio = Math.pow(high / total, 2);
        const sum = lRatio + mRatio + hRatio;
        const weapon = (hRatio > mRatio && hRatio > lRatio) ? "マシンガン" : (mRatio > lRatio) ? "ビームガン" : "ミサイル";
        let color = (lRatio > (mRatio + hRatio) * 0.5) ? "#FF4500" : (mRatio > hRatio) ? "#FFD700" : "#87CEFA";
        
        return { 
            name: fileName, 
            size: size, 
            scale: scaleMap[size], 
            level: 1,
            def: Math.max(1, Math.round((lRatio / sum) * 1000)), 
            atk: Math.max(1, Math.round((mRatio / sum) * 1000)), 
            spd: Math.max(1, Math.round((hRatio / sum) * 1000)), 
            weapon: weapon, 
            color: color, 
            bgmData: window.DEFAULT_BGM 
        };
    }

    function saveMachine() {
        if(!window.currentStats) return alert("解析を完了してください");
        
        if(!window.currentStats.bgmData) {
            window.currentStats.bgmData = window.DEFAULT_BGM;
        }

        const slotId = new URLSearchParams(window.location.search).get('id') || "0";
        window.currentStats.level = 1;

        const keyName = `robot_slot_${slotId}`;
        localStorage.setItem(keyName, JSON.stringify(window.currentStats));
        
        alert("格納庫No." + slotId + "に配備しました！");
        location.href = `my_robot_manage.html?id=${slotId}`;
    }

    window.DEFAULT_BGM = {
        id: "bgm_default_01",
        title: "デフォルト",
        author: "tujitecr",
        comment: "2026年7月9日作曲",
        tempo: 0.2,
        sequence: ["60,62,60,62,60,62,60,62,64,64,64,0,60,62,60,62,60,62,60,62,64,64,64,0,67,69,67,69,67,69,67,69,71,71,71,0,67,69,67,69,67,69,67,69,71,71,71,0,0,62,64,65,65,64,62,0,62,64,65,65,64,62,0,67,69,69,69,-,67,69,69,69,-,0,60,60,60"]
    };
    </script>
</body>
</html>
