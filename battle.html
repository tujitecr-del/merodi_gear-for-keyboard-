<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バトルモード</title>
    <style>
        body { margin: 0; background: #000; color: #fff; touch-action: none; overflow-x: hidden; font-family: sans-serif; }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 2px solid #555;
            margin: 0 auto;
        }

        #canvas { display: block; width: 400px; height: 400px; position: relative; z-index: 1000; }
      
        #my-avatar-container, #enemy-avatar-container {
            position: absolute;
            z-index: 1001;
            pointer-events: none;
            width: 64px; height: 64px;
        }

        .input-container { display: flex; justify-content: space-between; align-items: flex-end; padding: 20px; }
        .d-pad { display: grid; grid-template-columns: 50px 50px 50px; gap: 2px; }
        .action-btns { display: grid; grid-template-columns: 60px 60px; gap: 5px; }
    
        #start-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            border: 2px solid white;
            background-color: rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        /* 1. アイコン下の隙間を消す */
.avatar-wrapper img {
    display: block; /* これで下の余白が消えます */
}

    </style>
</head>
<body>

<!-- 戦闘画面（キャンバス）とカウントダウン表示エリア -->
<div id="game-container" style="position: relative; width: 400px; height: 400px; margin: 0 auto; background-size: cover; background-position: center; border: 2px solid #555;">
    <canvas id="canvas" width="400" height="400" style="display: block; width: 400px; height: 400px; position: relative; z-index: 1000;"></canvas>
    <div id="battle-countdown" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; font-size: 80px; font-weight: bold; color: yellow; text-shadow: 3px 3px 6px #000, -3px -3px 6px #000; z-index: 1001; pointer-events: none;">3</div>
</div>

<!-- ゲージをまとめる親コンテナ -->
<div id="gauge-wrapper" style="width: 400px; margin: 10px auto;">
    
    <!-- ENゲージ行 -->
    <div style="display: flex; align-items: center; margin-bottom: 5px;">
        <span style="width: 40px; font-weight: bold; color: white;">EN:</span>
        <div id="en-gauge-container" style="flex-grow: 1; background: #333; height: 20px; border: 1px solid #fff;">
            <div id="en-bar" style="width: 0%; height: 100%; background: blue; transition: width 0.2s;"></div>
        </div>
    </div>

    <!-- HPゲージ行 -->
    <div style="display: flex; align-items: center;">
        <span style="width: 40px; font-weight: bold; color: rgb(255, 255, 255);">HP:</span>
        <div id="hp-container" style="flex-grow: 1; height: 20px; border: 2px solid #000; background: #ddd;">
            <div id="hp-bar" style="width: 100%; height: 100%; background: green; transition: width 0.3s;"></div>
        </div>
    </div>

</div>

<!-- 操作ボタンエリア -->
<div class="input-container" style="display: flex; justify-content: space-between; align-items: flex-end; width: 400px; margin: 0 auto; padding: 10px 0;">
    <div class="d-pad" style="display: grid; grid-template-columns: 50px 50px 50px; gap: 2px;">
        <button style="grid-column: 2; grid-row: 1;" id="btn-up">▲</button>
        <button style="grid-column: 1; grid-row: 2;" id="btn-left">◀</button>
        <button style="grid-column: 3; grid-row: 2;" id="btn-right">▶</button>
        <button style="grid-column: 2; grid-row: 3;" id="btn-down">▼</button>
    </div>
    <div class="action-btns" style="display: grid; grid-template-columns: 60px 60px; gap: 5px;">
        <button id="btn-en">EN</button>
        <button id="btn-barrier">バリア</button>
        <button id="btn-near">近</button>
        <button id="btn-far">遠</button>
    </div>
</div>

<!-- タイマー表示のエリア -->
<div style="width: 400px; margin: 10px auto; text-align: center;">
    <div id="timer-display" style="color: white; font-size: 20px; font-weight: bold; margin-bottom: 5px;">
        TIME: 05:00
    </div>
</div>

<!-- 開始前のBGM確認オーバーレイ -->
<div id="start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <h1 style="color: white;">音楽を鳴らします</h1>
    <div id="bgm-info" style="margin: 20px; padding: 15px; border: 1px solid #444; text-align: left; background: #222; color: white;">
        <p>曲名: <span id="bgm-title">読み込み中...</span></p>
        <p>作曲者: <span id="bgm-author">読み込み中...</span></p>
        <p>コメント: <span id="bgm-comment">読み込み中...</span></p>
        <button id="start-btn" style="margin-top: 10px; padding: 10px 20px; font-size: 16px;">音量OKですか？</button>
    </div>
</div>

<script>
    // 背景設定関数
    function setDailyBackground() {
        const totalImages = 4;
        const dayIndex = Math.floor(Date.now() / (1000 * 60 * 60 * 24)) % totalImages;
        const fileNumber = (dayIndex + 1).toString().padStart(3, '0');
        const container = document.getElementById('game-container');
        if (container) {
            container.style.backgroundImage = `url('stage_picture/${fileNumber}.jpg')`;
        }
    }

    // 初期化処理
    document.addEventListener('DOMContentLoaded', () => {
        setDailyBackground();
        window.currentInputMode = 'touch';

        // 1. 保存されたバトルデータを取得
        const rawData = localStorage.getItem('battleData');
        if (!rawData) {
            alert("戦闘データが見つかりません。掲示板からやり直してください。");
            location.href = 'board.html';
            return;
        }

        const battleData = JSON.parse(rawData);
        window.enemyStats = battleData.enemy?.robot;
        
        // 2. BGM情報の表示
        if (window.enemyStats && window.enemyStats.bgmData) {
            document.getElementById('bgm-title').innerText = window.enemyStats.bgmData.title || "不明な曲";
            document.getElementById('bgm-author').innerText = window.enemyStats.bgmData.composer || "不明な作曲者";
            document.getElementById('bgm-comment').innerText = window.enemyStats.bgmData.comment || "特になし";
        }
    });

    // 開始ボタン処理
    document.getElementById('start-btn').addEventListener('click', () => {
        if (typeof window.startEverything === 'function') {
            document.getElementById('start-overlay').style.display = 'none';
            window.startEverything();
        } else {
            alert("準備中です...");
        }
    });
</script>

<script src="state.js"></script>
<script src="render.js"></script>
<script src="playback.js"></script>
<script src="battle_engine.js"></script>
<script src="audio_manager.js"></script>
<script src="data_loader.js"></script>
<script src="battle_input.js"></script>

</body>
</html>
