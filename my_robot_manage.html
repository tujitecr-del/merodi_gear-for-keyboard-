<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>機体管理格納庫</title>
</head>
<body>

<div id="container">
    <h2>機体管理格納庫 - 倉庫No: <span id="val-slot">0</span></h2>
    
    <section id="robot-info">
        <h3>機体詳細</h3>
        <ul>
            <li>機体名: <span id="val-name">-</span></li>
            <li>電脳レベル: <span id="val-level">0</span></li>
            <li>機体色: <span id="val-color">-</span></li>
            <li>サイズ: <span id="val-size">-</span></li>
            <li>攻撃力: <span id="val-atk">-</span></li>
            <li>防御力: <span id="val-def">-</span></li>
            <li>速度: <span id="val-spd">-</span></li>
            <li>武装: <span id="val-weapon">-</span></li>
            <li>総合評価:<span id="val-rating"></span></li>
        </ul>
    </section>

    <div id="actions">
        <button id="generateBtn">音楽から機体生成</button>
        <button onclick="location.href='modify.html'">機体改造</button>
        <button onclick="location.href='base.html'">基地へ戻る</button>
        <button id="postToBoardBtn" style="background: #4ecca3; color: #1a1a2e; margin-top: 10px; width: 100%;">
            この機体を放置対戦させる（オンライン登録）
        </button>
    </div>

    <section id="bgm-section">
        <h3>放置戦闘時に使う相手へのBGM</h3>
        <ul>
            <li>曲名: <span id="val-title">-</span></li>
            <li>作者: <span id="val-author">-</span></li>
            <li>コメント: <span id="val-comment">-</span></li>
        </ul>

        <button onclick="document.getElementById('bgm-settings').style.display = 'block';">BGMを変更する</button>

        <div id="bgm-settings" style="display: none; border: 1px dashed #4ecca3; padding: 10px; margin-top: 10px;">
            <p>【方法1】ファイルから変更</p>
            <input type="file" id="bgmFile" accept=".melogefile">
            
            <p style="margin-top: 10px;">【方法2】獲得済みコレクションから選ぶ</p>
            <select id="collectionSelect" onchange="selectBgmFromCollection(this.value)">
                <option value="">-- 取得済みBGMを選択 --</option>
            </select>

            <div class="player-controls" style="margin-top: 10px;">
                <button id="playBtn">▶ 再生</button>
                <button id="stopBtn">■ 停止</button>
                <button onclick="document.getElementById('bgm-settings').style.display = 'none';"> 設定を閉じる </button>
            </div>
        </div>
    </section>

    <canvas id="robot-visual" width="400" height="400" style="border:1px solid #4ecca3; display:block; margin:10px auto;"></canvas>
</div>

<!-- Firebase SDK の読み込み -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // Firebase初期化
    const firebaseConfig = {
        apiKey: "AIzaSyCJ5h0o9RdNf19wJYXQRzd7rfJDazeRmwc",
        authDomain: "merodigear.firebaseapp.com",
        projectId: "merodigear",
        storageBucket: "merodigear.firebasestorage.app",
        messagingSenderId: "863493263922",
        appId: "1:863493263922:web:637be57f738317b2a0622b",
        measurementId: "G-34K1QLXL4S"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let currentMelogeData = null;   
    let slotId = "0";

    // --- 1. Playback エンジン ---
    const Playback = {
        audioCtx: null, masterGain: null, playTimeout: null, isPlaying: false, currentTempo: 0.2,
        init() {
            if (!this.audioCtx) {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.audioCtx.createGain();
                this.masterGain.connect(this.audioCtx.destination);
                this.masterGain.gain.value = 0.19;
            }
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        },
        stop() { this.isPlaying = false; clearTimeout(this.playTimeout); this.playTimeout = null; },
        async play(jsonData, tempoSeconds = 0.2) {
            this.init(); this.stop();
            this.currentTempo = tempoSeconds * 1000;
            this.isPlaying = true;
            let seq = Array.isArray(jsonData.sequence) ? jsonData.sequence : (typeof jsonData.sequence === 'string' ? jsonData.sequence.split(',') : []);
            let i = 0, currentWave = 'square';
            const step = () => {
                if (!this.isPlaying) return;
                if (i >= seq.length) i = 0;
                let val = seq[i];
                let waitTime = this.currentTempo;
                if (typeof val === 'string' && val.startsWith('[')) { currentWave = val.replace(/[\[\]]/g, ''); }
                else if (val !== '0' && val !== 0 && val !== "" && val !== '-') {
                    let note = Number(val);
                    if (!isNaN(note)) {
                        let durationCount = 1;
                        while (i + 1 < seq.length && seq[i + 1] === '-') { durationCount++; i++; }
                        waitTime = durationCount * this.currentTempo;
                        this.playNote(note, currentWave, waitTime - 20);
                    }
                }
                i++; this.playTimeout = setTimeout(step, waitTime);
            };
            step();
        },
        playNote(n, wave, duration) {
            if (isNaN(n) || !this.audioCtx) return;
            const osc = this.audioCtx.createOscillator();
            osc.type = wave;
            osc.frequency.setValueAtTime(440 * Math.pow(2, (n - 69) / 12), this.audioCtx.currentTime);
            osc.connect(this.masterGain);
            osc.start();
            setTimeout(() => { try { osc.stop(); osc.disconnect(); } catch(e) {} }, duration);
        }
    };

    // --- 2. メインロジック ---
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        slotId = urlParams.get('id') !== null ? urlParams.get('id') : (localStorage.getItem('activeRobotId') || "0");

        const slotElem = document.getElementById('val-slot');
        if (slotElem) slotElem.innerText = slotId;

        loadRobotData(slotId);
        loadCollectionToSelect();

        const bgmFileElem = document.getElementById('bgmFile');
        if (bgmFileElem) {
            bgmFileElem.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = JSON.parse(event.target.result);
                    currentMelogeData = data;
                    
                    document.getElementById('val-title').innerText = data.title || "-";
                    document.getElementById('val-author').innerText = data.author || "-";
                    document.getElementById('val-comment').innerText = data.comment || "-";
                    
                    let robot = JSON.parse(localStorage.getItem(`robot_slot_${slotId}`));
                    if (robot) {
                        robot.bgmData = data;
                        localStorage.setItem(`robot_slot_${slotId}`, JSON.stringify(robot));
                        alert("BGMを更新しました！");
                    }
                };
                reader.readAsText(file);
            });
        }
        
        const playBtn = document.getElementById('playBtn');
        if (playBtn) {
            playBtn.onclick = () => {
                if (currentMelogeData) Playback.play(currentMelogeData, parseFloat(currentMelogeData.tempo) || 0.2);
                else alert("BGMが読み込まれていません！");
            };
        }
        const stopBtn = document.getElementById('stopBtn');
        if (stopBtn) {
            stopBtn.onclick = () => Playback.stop();
        }

        const generateBtn = document.getElementById('generateBtn');
        if (generateBtn) {
            generateBtn.onclick = () => { location.href = `my_robot_generate.html?id=${slotId}`; };
        }

        const modifyBtn = document.querySelector('button[onclick*="modify.html"]');
        if (modifyBtn) {
            modifyBtn.onclick = () => { location.href = `modify.html?id=${slotId}`; };
        }

        // ★ Firebaseの掲示板へ機体を登録する処理に変更
        const postBtn = document.getElementById('postToBoardBtn');
        if (postBtn) {
            postBtn.onclick = async () => {
                const myRobot = JSON.parse(localStorage.getItem(`robot_slot_${slotId}`));
                if (!myRobot) return alert("機体データがありません");
                
                if (!myRobot.bgmData) {
                    myRobot.bgmData = window.DEFAULT_BGM || {
                        title: "デフォルト曲",
                        composer: "tujitecr",
                        sequence: "60,62,60,62,64,0"
                    };
                }

                const postData = {
                    robot: myRobot, 
                    avatar: { 
                        name: localStorage.getItem('pilotName') || "パイロット", 
                        icon: localStorage.getItem('avatarImage') 
                    },
                    timestamp: new Date().toISOString()
                };

                try {
                    postBtn.innerText = "送信中...";
                    postBtn.disabled = true;

                    // Firebaseの 'board_posts' にデータをプッシュ追加
                    await database.ref('board_posts').push(postData);

                    alert("世界中の放置対戦掲示板に機体を登録しました！");
                } catch (error) {
                    console.error("登録エラー:", error);
                    alert("登録に失敗しました。ネット接続を確認してください。");
                } finally {
                    postBtn.innerText = "この機体を放置対戦させる（オンライン登録）";
                    postBtn.disabled = false;
                }
            };
        }
    });

    function loadRobotData(targetSlotId) {
        const rawData = localStorage.getItem(`robot_slot_${targetSlotId}`);
        
        if (!rawData) {
            alert("機体データが見つかりません。");
            return;
        }
        
        const robot = JSON.parse(rawData);

        document.getElementById('val-name').innerText = robot.name || "-";
        document.getElementById('val-color').innerText = robot.color || "-";
        document.getElementById('val-size').innerText = robot.size || "-";
        document.getElementById('val-atk').innerText = robot.atk || "0";
        document.getElementById('val-def').innerText = robot.def || "0";
        document.getElementById('val-spd').innerText = robot.spd || "0";
        document.getElementById('val-weapon').innerText = robot.weapon || "なし";
        
        const currentLevel = robot.level !== undefined ? robot.level : (robot.Level !== undefined ? robot.Level : 1);
        document.getElementById('val-level').innerText = currentLevel;
        
        const rating = ((parseFloat(robot.atk)||0) + (parseFloat(robot.def)||0) + (parseFloat(robot.spd)||0) + (parseFloat(currentLevel)||0)) * 0.1;
        document.getElementById('val-rating').innerText = rating.toFixed(1);

        if (robot.bgmData) {
            currentMelogeData = robot.bgmData;
            document.getElementById('val-title').innerText = currentMelogeData.title || "-";
            document.getElementById('val-author').innerText = currentMelogeData.author || "不明";
            document.getElementById('val-comment').innerText = currentMelogeData.comment || "なし";
        }
        drawRobot(robot);
    }

    function drawRobot(stats) {
        const canvas = document.getElementById('robot-visual');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const scale = stats.scale || 1.0;
        const b = ((stats.def || 0) * 0.0334 * 2) * scale;
        const a = ((stats.atk || 0) * 0.0334) * scale;
        const l = ((stats.spd || 0) * 0.0334) * scale;

        const shapes = [
            {"type": "circle", "x": 200, "y": 80, "r": 30},
            {"type": "rect", "x": 185, "y": 75, "w": 30, "h": 10},
            {"type": "line", "x1": 200, "y1": 110, "x2": 200, "y2": 220},
            {"type": "line", "x1": 170, "y1": 220, "x2": 230, "y2": 220},
            {"type": "line", "x1": 170, "y1": 220, "x2": 170, "y2": 330},
            {"type": "line", "x1": 230, "y1": 220, "x2": 230, "y2": 330},
            {"type": "line", "x1": 150, "y1": 130, "x2": 250, "y2": 130},
            {"type": "line", "x1": 150, "y1": 130, "x2": 120, "y2": 220},
            {"type": "line", "x1": 250, "y1": 130, "x2": 280, "y2": 220}
        ];

        shapes.forEach((s, i) => {
            ctx.beginPath();
            ctx.strokeStyle = stats.color || "#4ecca3";
            ctx.fillStyle = stats.color || "#4ecca3";
            if (i === 2) ctx.lineWidth = Math.max(1, b);
            else if (i >= 6) ctx.lineWidth = Math.max(1, a);
            else if (i >= 3 && i <= 5) ctx.lineWidth = Math.max(1, l);
            else ctx.lineWidth = 2;

            if (s.type === 'circle') { ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
            else if (s.type === 'rect') { ctx.fillStyle = "#000"; ctx.fillRect(s.x, s.y, s.w, s.h); }
            else if (s.type === 'line') { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
        });
    }

    function loadCollectionToSelect() {
        const select = document.getElementById('collectionSelect');
        if (!select) return;

        select.innerHTML = '<option value="">-- 取得済みBGMを選択 --</option>';

        const storedSongs = JSON.parse(localStorage.getItem('stored_songs_data')) || {};
        const unlockedIds = JSON.parse(localStorage.getItem('unlocked_bgm_ids')) || [];

        unlockedIds.forEach(id => {
            const song = storedSongs[id];
            if (song) {
                const option = document.createElement('option');
                option.value = id;
                option.innerText = `${song.title || '無題'} (作者: ${song.author || '不明'})`;
                select.appendChild(option);
            }
        });
    }

    function selectBgmFromCollection(songId) {
        if (!songId) return;
        const storedSongs = JSON.parse(localStorage.getItem('stored_songs_data')) || {};
        const selectedSong = storedSongs[songId];

        if (selectedSong) {
            currentMelogeData = selectedSong;
            
            document.getElementById('val-title').innerText = selectedSong.title || "-";
            document.getElementById('val-author').innerText = selectedSong.author || "-";
            document.getElementById('val-comment').innerText = selectedSong.comment || "-";

            let robot = JSON.parse(localStorage.getItem(`robot_slot_${slotId}`));
            if (robot) {
                robot.bgmData = selectedSong;
                localStorage.setItem(`robot_slot_${slotId}`, JSON.stringify(robot));
                alert(`BGM「${selectedSong.title}」を機体に設定しました！`);
            }
        }
    }
</script>
</body>
</html>
