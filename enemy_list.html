<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホ対応のビューポート設定を追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放置対戦募集掲示板</title>
    <style>
        body { 
            background: #0f0f1a; 
            color: #4ecca3; 
            font-family: sans-serif; 
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a2e;
            border: 2px solid #4ecca3;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 1.2rem;
            text-align: center;
            margin-top: 0;
            color: #fff;
            border-bottom: 1px dashed #4ecca3;
            padding-bottom: 10px;
        }
        .header-actions {
            margin-bottom: 15px;
        }
        .controls { 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column;
            gap: 10px; 
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #4ecca3;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .sort-buttons {
            display: flex;
            gap: 10px;
        }
        .sort-buttons button {
            flex: 1;
            margin-top: 0;
        }
        button {
            background: #333;
            color: #4ecca3;
            border: 1px solid #4ecca3;
            padding: 10px 15px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            box-sizing: border-box;
        }
        button:hover { 
            background: #4ecca3; 
            color: #1a1a2e; 
        }
        #board-list { 
            height: 400px; 
            overflow-y: auto; 
            border: 1px solid #4ecca3; 
            padding: 10px; 
            border-radius: 8px; 
            background: #121220;
            box-sizing: border-box;
        }
        .board-card {
            border: 1px solid #334455;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #16213e;
        }
        .card-header { 
            font-size: 1rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            color: #fff;
            word-break: break-all;
        }
        .card-body { 
            margin-bottom: 10px; 
            font-size: 0.85rem; 
            color: #aaa;
        }
        .card-actions {
            display: flex;
            gap: 10px;
        }
        .card-actions button {
            flex: 1;
            padding: 8px;
            font-size: 0.9rem;
        }
        .battle-btn {
            background: #e94560 !important;
            color: white !important;
            border: 1px solid #ff6b81 !important;
        }
        .battle-btn:hover {
            background: #ff6b81 !important;
            color: #1a1a2e !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>対戦相手募集掲示板</h2>

        <div class="header-actions">
            <button onclick="location.href='index.html'" style="background: #222; color: #aaa; border-color: #666; width: 100%;">◀ 基地へ戻る</button>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="機体名で検索" oninput="renderBoard()">
            <div class="sort-buttons">
                <button onclick="sortBoard('newest')">最新順</button>
                <button onclick="sortBoard('level')">Lv高い順</button>
            </div>
        </div>

        <div id="board-list">
            <p style="text-align:center; color:#888;">データを読み込み中...</p>
        </div>
    </div>

    <!-- Firebase SDK の読み込み -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJ5h0o9RdNf19wJYXQRzd7rfJDazeRmwc",
            authDomain: "merodigear.firebaseapp.com",
            databaseURL: "https://merodigear-e4e97-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "merodigear",
            storageBucket: "merodigear.firebasestorage.app",
            messagingSenderId: "863493263922",
            appId: "1:863493263922:web:637be57f738317b2a0622b",
            measurementId: "G-34K1QLXL4S"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function calculateOverallRating(atk, armor, speed, level) {
            const a = parseFloat(atk) || 0;
            const ar = parseFloat(armor) || 0;
            const s = parseFloat(speed) || 0;
            const l = parseFloat(level) || 0;
            const rating = (a + ar + s + l) * 0.1;
            return rating.toFixed(1);
        }

        const BANNED_SONGS = ["著作権的にまずい曲名A", "著作権的にまずい曲名B"];
        const MAX_DISPLAY_COUNT = 300; 

        let currentSortMode = 'newest';
        let cachedPosts = []; 

        async function fetchAndRenderBoard() {
            const list = document.getElementById('board-list');
            list.innerHTML = "<p style='text-align:center; color:#888;'>読み込み中...</p>";

            try {
                const snapshot = await database.ref('board_posts').once('value');
                const data = snapshot.val();
                
                if (data) {
                    cachedPosts = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                } else {
                    cachedPosts = [];
                }
                renderBoard();
            } catch (error) {
                console.error("データ取得エラー:", error);
                list.innerHTML = "<p style='text-align:center; color:#ff6b6b;'>データの読み込みに失敗しました。</p>";
            }
        }

        function renderBoard() {
            const list = document.getElementById('board-list');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            let allPosts = [...cachedPosts];

            if (currentSortMode === 'newest') {
                allPosts.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
            } else if (currentSortMode === 'level') {
                allPosts.sort((a, b) => (b.robot?.level || 1) - (a.robot?.level || 1));
            }

            const displayList = allPosts
                .filter(post => {
                    if (!post.robot) return false;
                    
                    const title = post.robot.bgmData?.title;
                    if (title && BANNED_SONGS.includes(title)) return false;

                    if (searchKeyword && !post.robot.name.toLowerCase().includes(searchKeyword)) {
                        return false;
                    }
                    return true;
                })
                .slice(0, MAX_DISPLAY_COUNT);

            if (displayList.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#888;'>該当する対戦相手がいません。</p>";
                return;
            }

            list.innerHTML = '';
            
            displayList.forEach((e) => {
                const card = document.createElement('div');
                card.className = 'board-card';
                card.innerHTML = `
                    <div class="card-header">
                        Lv.${e.robot.level || 1} / 評価:${calculateOverallRating(e.robot.atk, e.robot.def, e.robot.spd, e.robot.level)}<br>
                        ${e.robot.name}
                    </div>
                    <div class="card-body">
                        パイロット: ${e.avatar?.name || "名無し"}
                    </div>
                    <div class="card-actions">
                        <button class="detail-btn">詳細</button>
                        <button class="battle-btn">バトる</button>
                    </div>
                `;

                card.querySelector('.detail-btn').onclick = () => {
                    location.href = `enemy_detail.html?id=${e.id}`;
                };

                card.querySelector('.battle-btn').onclick = () => {
                    startBattle(e.robot, e.avatar);
                };

                list.appendChild(card);
            });
        }

        function sortBoard(mode) {
            currentSortMode = mode;
            renderBoard();
        }

        function startBattle(enemyRobotData, enemyAvatarData) {
            if (!enemyRobotData.bgmData) {
                enemyRobotData.bgmData = {
                    title: "デフォルト曲",
                    composer: "tujitecr",
                    comment: "デフォルト曲",
                    sequence: "60,62,60,62,60,62,60,62,64,64,64,0,60,62,60,62,60,62,60,62,64,64,64,0,67,69,67,69,67,69,67,69,71,71,71,0,67,69,67,69,67,69,67,69,71,71,71,0,0,62,64,65,65,64,62,0,62,64,65,65,64,62,0,67,69,69,69,-,67,69,69,69,-,0,60,60,600", 
                    tempo: 0.2
                };
            }
            
            const myRobotId = localStorage.getItem('activeRobotId');
            const myRobotData = JSON.parse(localStorage.getItem(`robot_slot_${myRobotId}`));

            if (!myRobotData) {
                alert("搭乗中の機体が見つかりません！格納庫で搭乗してください。");
                return;
            }

            const battleData = {
                player: {
                    avatar: { name: localStorage.getItem('pilotName') || "パイロット", icon: localStorage.getItem('avatarImage') },
                    robot: myRobotData 
                },
                enemy: {
                    avatar: enemyAvatarData || { name: "CPUパイロット" },
                    robot: enemyRobotData
                }
            };

            localStorage.setItem('battleData', JSON.stringify(battleData));
            location.href = 'battle.html';
        }

        fetchAndRenderBoard();
    </script>
</body>
</html>
