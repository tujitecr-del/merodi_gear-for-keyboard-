<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホ対応のビューポート設定を追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格納庫 - メロディーギア</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
        }

        .backup-area {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .backup-area h3 {
            margin-top: 0;
            font-size: 1.1rem;
        }

        .backup-area button {
            background: #1abc9c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            margin: 5px;
        }
        .backup-area button:hover { background: #16a085; }

        .hangar-grid {
            display: grid;
            /* スマホの画面幅に合わせるため 100% 基準に変更 */
            grid-template-columns: minmax(100%, 1fr); 
            gap: 12px;
        }

        /* スロット全体のデザイン */
        .slot-item {
            border: 2px solid #ecf0f1;
            padding: 15px;
            background: #34495e;
            border-radius: 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .slot-name-area {
            flex-grow: 1;
            margin-right: 15px;
            word-wrap: break-word; 
            overflow-wrap: break-word;
        }

        .robot-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ecf0f1;
            margin: 0;
        }

        .bgm-title {
            font-size: 0.75rem !important; 
            color: #7f8c8d !important;     
            margin-top: 2px !important;
            font-style: italic;             
        }

        /* ボタンエリアと各ボタン */
        .button-area { 
            display: flex; 
            flex-direction: column;
            gap: 8px; 
            flex-shrink: 0; 
        }

        .slot-item button {
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        .btn-manage { background: #e67e22; }
        .btn-manage:hover { background: #d35400; }

        .btn-equip { background: #f39c12; }
        .btn-equip:hover { background: #d68910; }
    </style>
</head>
<body>

<div class="container">
    <h1>格納庫 (50スロット)</h1>

    <div class="backup-area">
        <h3>全データバックアップ</h3>
        <button onclick="exportAllData()">全機体データをコピー</button>
        <button onclick="importAllData()">全機体データを復元</button>
        <br>
        <button onclick="location.href='base.html'" style="background: #7f8c8d; margin-top: 10px;">基地へ戻る</button>
    </div>

    <div id="hangar" class="hangar-grid"></div>
</div>

<script>
    const hangar = document.getElementById('hangar');
    const MAX_SLOTS = 50;

    // 画面ロード時に表示
    renderHangar();

    function renderHangar() {
        hangar.innerHTML = ''; // 一度クリア
        const activeRobotId = localStorage.getItem('activeRobotId');

        for (let i = 0; i < MAX_SLOTS; i++) {
            const key = `robot_slot_${i}`;
            const data = localStorage.getItem(key);
            const robot = data ? JSON.parse(data) : null;
            
            const name = robot ? robot.name : "空きスロット";
            const level = robot ? (robot.level || 1) : "-";
            const isSelected = (activeRobotId == i);

            const div = document.createElement('div');
            const slotNum = String(i).padStart(2, '0'); 

            div.innerHTML = `
                <div class="slot-item">
                    <div class="slot-name-area">
                        <div class="robot-name">
                            [No.${slotNum}] ${name} 
                            <span style="font-size: 0.8em; color: #f1c40f;">(LV: ${level})</span>
                        </div>
                        <div class="bgm-title"></div>
                        ${isSelected ? '<div style="color:#2ecc71; font-weight:bold; font-size:0.85rem; margin-top:4px;">===★搭乗中★===</div>' : ''}
                    </div>
                    
                    <div class="button-area">
                        <button class="btn-manage" onclick="location.href='my_robot_manage.html?id=${i}'">管理</button>
                        ${robot ? `<button class="btn-equip" onclick="equipRobot('${i}')">搭乗する</button>` : ''}
                    </div>
                </div>
            `;
            hangar.appendChild(div);
        }
    }

    function equipRobot(robotId) {
        localStorage.setItem('activeRobotId', robotId);
        alert("機体に搭乗しました！");
        location.reload(); 
    }

    // --- バックアップ関連 ---
    function exportAllData() {
        let allData = {};
        for (let i = 0; i < MAX_SLOTS; i++) {
            const data = localStorage.getItem(`robot_slot_${i}`);
            if (data) allData[`robot_slot_${i}`] = JSON.parse(data);
        }
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(allData))));
        navigator.clipboard.writeText(encoded);
        alert("全データをコピーしました。");
    }

    function importAllData() {
        const code = prompt("バックアップコードを貼り付けてください");
        if (!code) return;
        try {
            const decoded = JSON.parse(decodeURIComponent(escape(atob(code))));
            for (let key in decoded) {
                localStorage.setItem(key, JSON.stringify(decoded[key]));
            }
            alert("復元完了！");
            location.reload();
        } catch(e) { alert("無効なデータです。"); }
    }
</script>

</body>
</html>
